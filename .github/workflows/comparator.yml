name: Lean comparator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/comparator.yml
      - comparator.json
      - lake-manifest.json
      - lakefile.toml
      - lean-toolchain
      - 'FClikelean/**'
      - 'lean/**'
      - 'leanWithComparator/*.lean'
      - leanWithComparator/sync_definitions.py
      - verification/Check.lean
      - verification/verify.py
      - 'vendor/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the FC-style sources
        run: python3 leanWithComparator/sync_definitions.py --check
      - name: Set up the comparator sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor bubblewrap
          sandbox=$(command -v bwrap)
          probe=(--ro-bind / / --dev /dev --proc /proc --unshare-all -- /usr/bin/true)
          if ! "$sandbox" "${probe[@]}"; then
            sudo install -m 0755 "$sandbox" /usr/local/bin/erdos104-bwrap
            sandbox=/usr/local/bin/erdos104-bwrap
            sudo apparmor_parser -r <<'APPARMOR'
          abi <abi/4.0>,
          include <tunables/global>
          profile erdos104-bwrap /usr/local/bin/erdos104-bwrap flags=(unconfined) {
            userns,
          }
          APPARMOR
            "$sandbox" "${probe[@]}"
          fi
          echo "COMPARATOR_BWRAP=$sandbox" >> "$GITHUB_ENV"
      - name: Install elan
        run: |
          installer="$RUNNER_TEMP/erdos104-elan-init.sh"
          curl --proto '=https' --tlsv1.2 -fsSL https://elan.lean-lang.org/elan-init.sh -o "$installer"
          sh "$installer" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Mathlib build artifacts
        run: |
          mapfile -t modules < <(
            awk '/^public import Mathlib[.]/ {print $3}' lean/Erdos104UnitTriples.lean FClikelean/104variant.lean | sort -u
          )
          lake exe cache get "${modules[@]}"
      - name: Compare both targets and replay in a fresh Lean kernel
        run: python3 verification/verify.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: comparator-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/results/
          retention-days: 90
          if-no-files-found: ignore
